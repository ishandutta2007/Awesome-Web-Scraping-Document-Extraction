<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Glowing accent gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <!-- Card glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
    }
    .node-pulse {
      animation: pulse 3s infinite ease-in-out;
    }
    .data-flow-1 {
      stroke-dasharray: 8 6;
      animation: dash1 18s linear infinite;
    }
    .data-flow-2 {
      stroke-dasharray: 6 8;
      animation: dash2 14s linear infinite;
    }
    .floating-card-1 {
      animation: float1 6s ease-in-out infinite alternate;
    }
    .floating-card-2 {
      animation: float2 7s ease-in-out infinite alternate;
    }
    @keyframes dash1 {
      to {
        stroke-dashoffset: -200;
      }
    }
    @keyframes dash2 {
      to {
        stroke-dashoffset: 200;
      }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(8px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="340" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Background Blobs (Behind all text and cards) -->
  <g opacity="0.45">
    <circle cx="150" cy="80" r="130" fill="#0284c7" filter="url(#glow)" class="node-pulse" style="transform-origin: 150px 80px;" />
    <circle cx="1050" cy="240" r="140" fill="#7c3aed" filter="url(#glow)" class="node-pulse" style="transform-origin: 1050px 240px; animation-delay: 1.5s;" />
    <circle cx="600" cy="30" r="90" fill="#0d9488" filter="url(#glow)" class="node-pulse" style="transform-origin: 600px 30px; animation-delay: 0.8s;" />
  </g>

  <!-- Dynamic Background Animated Flow Lines -->
  <g opacity="0.35">
    <path d="M 50 280 C 250 240, 350 320, 550 280 S 850 210, 1150 270" fill="none" stroke="#38bdf8" stroke-width="2.5" class="data-flow-1" />
    <path d="M 80 50 C 300 120, 500 40, 750 90 S 950 140, 1120 70" fill="none" stroke="#a855f7" stroke-width="2" class="data-flow-2" />
  </g>

  <!-- Animated Floating Metric Pill 1 (Bottom Right background) -->
  <g class="floating-card-1" transform="translate(860, 50)">
    <rect width="280" height="64" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="32" cy="32" r="16" fill="#0284c7" fill-opacity="0.2" />
    <text x="32" y="37" font-size="16" text-anchor="middle" fill="#38bdf8">🌐</text>
    <text x="60" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">EXTRACTION SPEED</text>
    <text x="60" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">10k+ pages / sec &amp; Stealth</text>
  </g>

  <!-- Animated Floating Metric Pill 2 (Bottom Right background) -->
  <g class="floating-card-2" transform="translate(860, 130)">
    <rect width="280" height="64" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="32" cy="32" r="16" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="32" y="37" font-size="16" text-anchor="middle" fill="#c084fc">📄</text>
    <text x="60" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">LLM &amp; RAG READY</text>
    <text x="60" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#c084fc">Clean Markdown &amp; JSON</text>
  </g>

  <!-- Animated Floating Metric Pill 3 -->
  <g class="floating-card-1" transform="translate(860, 210)">
    <rect width="280" height="64" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="32" cy="32" r="16" fill="#10b981" fill-opacity="0.2" />
    <text x="32" y="37" font-size="16" text-anchor="middle" fill="#34d399">⚡</text>
    <text x="60" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">OPEN-SOURCE STARS</text>
    <text x="60" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#34d399">1,000,000+ Community</text>
  </g>

  <!-- FOREGROUND: Category Badge -->
  <g transform="translate(70, 52)">
    <rect width="248" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text x="30" y="20" class="badge-text" fill="#38bdf8">AI DATA PIPELINES &amp; CRAWLERS</text>
  </g>

  <!-- FOREGROUND: Main Title -->
  <text x="70" y="132" class="title-text">
    Awesome Web Scraping &amp;
  </text>
  <text x="70" y="180" class="title-text" fill="url(#primaryGrad)">
    Document Extraction 🚀
  </text>

  <!-- FOREGROUND: Subtitle -->
  <text x="70" y="222" class="subtitle-text">
    Curated SaaS Platforms, Enterprise Proxy Networks &amp; Open-Source Engines
  </text>
  <text x="70" y="246" class="subtitle-text">
    for Stealth Crawling, PDF/HTML Parsing, and AI-Ready Markdown Pipelines.
  </text>

  <!-- Feature Pills on Left Bottom -->
  <g transform="translate(70, 276)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
      <text x="65" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">🕸️ Web Scraping</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(142, 0)">
      <rect width="155" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
      <text x="77" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">📑 Document Parsing</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(309, 0)">
      <rect width="145" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
      <text x="72" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">🤖 AI &amp; RAG Ready</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(466, 0)">
      <rect width="135" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
      <text x="67" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">🛡️ Anti-Bot Bypass</text>
    </g>
  </g>
</svg>
